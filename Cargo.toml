[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/legofsalmon/st2110"
license = "Elastic-2.0"
publish = false

[workspace.dependencies]
st2110-sdp = { path = "crates/sdp" }
st2110-nmos = { path = "crates/nmos" }
st2110-ptp = { path = "crates/ptp" }
st2110-pcap = { path = "crates/pcap" }
st2110-connect = { path = "crates/connect" }
st2110-media = { path = "crates/media" }
st2110-discover = { path = "crates/discover" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
nix = { version = "0.31", default-features = false, features = ["socket", "uio", "time", "net"] }
serde-wasm-bindgen = "0.6"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
wasm-bindgen = "0.2.100"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release.package.st2110-wasm]
opt-level = "s"
