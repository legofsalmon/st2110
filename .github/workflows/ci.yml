name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: The design system's copies are as they were vendored
        run: python3 scripts/design-system.py --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # `st2110 view` and its window are a default feature, and the rest builds without.
      - run: cargo clippy -p st2110-cli --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The bench and vizz run st2110 on Macs. The tests include a send and receive over the
  # loopback interface, which takes macOS's receive timestamps.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Discovery through the Mac's own multicast DNS responder: a stand-in NMOS Node that
      # dns-sd advertises, read peer to peer, and a tone announced by SAP.
      - name: Find streams on the Mac
        timeout-minutes: 5
        run: python3 scripts/try-discovery.py --check --st2110 target/debug/st2110

  # ST 2110 Viewer as it ships: the app bundle, playing a capture in its window on a Mac,
  # with a picture of the window to look at.
  viewer-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Third-party notices are current
        run: python3 scripts/third-party-notices.py --check
      - run: scripts/make-viewer-app.sh
      - name: Play a capture in the app
        timeout-minutes: 10
        run: |
          cargo build --release --locked -p st2110-cli
          target/release/st2110 send video 1280x720p25 --to 239.1.1.1:5004 --clock traceable --duration 3 \
            --sdp bars.sdp --pcap bars.pcap
          "dist/ST 2110 Viewer.app/Contents/MacOS/st2110-viewer" bars.sdp --pcap bars.pcap \
            --exit-after-frames 50 --screenshot viewer.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st2110-viewer-macos
          path: |
            dist/*.app.zip
            viewer.png
          if-no-files-found: ignore

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install the wasm-bindgen CLI that matches Cargo.lock
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: cargo build -p st2110-wasm --target wasm32-unknown-unknown --release --locked
      - run: wasm-bindgen --target nodejs --out-dir crates/wasm/pkg target/wasm32-unknown-unknown/release/st2110_wasm.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node crates/wasm/tests/smoke.cjs
