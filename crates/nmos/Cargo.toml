[package]
name = "st2110-nmos"
description = "Read-only checks of an AMWA NMOS registry and the SDP files its Senders publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An HTTP client for the IS-04 Query API and Senders' SDP files.
client = ["dep:ureq"]

[dependencies]
st2110-sdp = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
ureq = { workspace = true, optional = true }

[lints]
workspace = true
