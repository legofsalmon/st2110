   asked for, so they fade in and drop the small offset, at base with the
   entering curve; they leave at once. Under reduced motion the tokens take the
   offset to 0 and the fade to 120ms. A crosspoint and a card change colour in
   place, at fast. What never moves: the pictures, the meters and the counts,
   which change the moment they arrive, and the crosshair, which follows the
   pointer. */
.notice:not([hidden]), section.details:not([hidden]), .entry {
  transition: opacity var(--ds-duration-base) var(--ds-ease-enter), translate var(--ds-duration-base) var(--ds-ease-enter);
}
@starting-style {
  .notice:not([hidden]), section.details:not([hidden]), .entry { opacity: 0; translate: 0 calc(-1 * var(--ds-motion-offset-small)); }
}
@media (max-width: 600px) { .status { margin-left: 0; width: 100%; } .grid-wrap { max-height: none; } thead th.corner { min-width: 120px; } th.dst { white-space: normal; } }
</style>
</head>
<body>
<header>
  <h1>ST 2110 Router</h1>
  <span id="demo" class="ds-chip ds-chip--warn" title="A demo facility on this machine: nothing here reaches real equipment" hidden>Demo</span>
  <span id="registry" class="registry"></span>
  <span class="status"><span id="dot" class="ds-dot ds-dot--off"></span><span id="read">Reading the registry…</span></span>
</header>
<div class="toolbar">
  <div class="ds-seg" role="group" aria-label="Level" id="levels"></div>
  <div class="ds-seg" role="group" aria-label="Mode">
    <button id="mode-take" aria-pressed="true" title="Each click on a crosspoint connects it at once">Take on click</button>
    <button id="mode-salvo" aria-pressed="false" title="Arm several crosspoints, then take them together at one PTP time">Salvo</button>
  </div>
  <button id="fire" class="ds-btn ds-btn--primary" hidden>Take</button>
  <button id="clear" class="ds-btn" title="Release every armed crosspoint (Esc)" hidden>Clear</button>
  <span id="mode-hint" class="hint"></span>
  <label class="ds-switch" title="Check each connection against the Receiver, and connect nothing"><input type="checkbox" role="switch" id="dry"> Check only</label>
  <label class="ds-switch" title="Receive each source's stream on this machine to show its picture or sound"><input type="checkbox" role="switch" id="live"> Live previews</label>
  <span class="spacer"></span>
  <button id="refresh" class="ds-btn" title="Read the registry again">Refresh</button>
</div>
<div id="banner" class="ds-notice ds-notice--bad notice" role="alert" hidden></div>
<div id="info" class="ds-notice notice" role="status" hidden></div>
<section class="sources" aria-label="Sources">
  <div class="sources-head"><h2 class="label">Sources</h2><small id="sources-note"></small></div>
  <div id="cards" class="cards"></div>
</section>
<section id="details" class="details" aria-label="The open source's details" hidden aria-live="polite"></section>
<div class="grid-wrap"><div id="grid" class="empty">Reading the registry…</div></div>
<div class="legend">
  <span><i class="live"></i>taking now</span>
  <span><i></i>can take</span>
  <span><i class="unfit"></i>cannot take (click for why)</span>
  <span><i class="armed"></i>armed for the salvo</span>
</div>
<section class="log" aria-live="polite">
  <h2 class="label">Connections</h2>
  <div id="log"><div class="empty">Nothing switched yet.</div></div>
</section>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child != null) node.append(child);
  return node;
};

let state = null;          // the registry, as /api/state last answered
let level = "all";         // the format shown, or every one
let salvo = false;         // whether clicks arm crosspoints rather than take them
const armed = new Map();   // receiver id -> sender id, or null to disconnect
const busy = new Set();    // receiver ids being switched
let reading = false;
let taking = false;

async function call(url, options) {
  let response;
  try {
    response = await fetch(url, options);
  } catch (_) {
    throw Object.assign(new Error(`Cannot reach the router at ${location.host}: is st2110 router still running?`), { unreachable: true });
  }
  let body = null;
  try { body = await response.json(); } catch (_) { /* not JSON */ }
  if (!response.ok) throw new Error((body && body.error) || `HTTP ${response.status}`);
  return body;
}

async function read() {
  if (reading || taking) return;
  reading = true;
  try {
    state = await call("/api/state");
    if (live === null) setLive(remembered() ?? (state.demo && state.previews > 0));
    $("dot").className = "ds-dot ds-dot--ok";
    $("read").textContent = `Read at ${new Date(state.read_at).toLocaleTimeString()}`;
    $("banner").hidden = true;
    render();
  } catch (e) {
    $("dot").className = "ds-dot ds-dot--bad";
    $("read").textContent = e.unreachable ? "Router unreachable" : "Registry unreachable";
    // Where, what, and what next; the grid keeps what was last read.
    $("banner").replaceChildren(el("div", { class: "ds-notice__body" },
      el("div", { class: "ds-notice__title", text: e.unreachable ? "The router is not answering" : "The registry cannot be read" }),
      el("div", { text: `${/[.?!]$/.test(e.message) ? e.message : e.message + "."} Trying again every 3 seconds, or Refresh now; the grid shows what was last read.` })));
    $("banner").hidden = false;
  } finally {
    reading = false;
  }
}

function formats() {
  const seen = new Set();
  for (const r of state.receivers) if (r.format) seen.add(r.format);
  const order = ["video", "audio", "data", "mux"];
  return [...seen].sort((a, b) => (order.indexOf(a) + 1 || 9) - (order.indexOf(b) + 1 || 9) || a.localeCompare(b));
}

function renderLevels() {
  const box = $("levels");
  box.replaceChildren();
  const all = ["all", ...formats()];
  if (!all.includes(level)) level = "all";
  for (const name of all) {
    box.append(el("button", {
      "aria-pressed": String(name === level),
      text: name === "all" ? "All" : name[0].toUpperCase() + name.slice(1),
      onclick: () => { level = name; render(); },
    }));
  }
}

function name(resource) {
  return resource.label || resource.id.slice(0, 8);
}

function render() {
  if (!state) return;
  $("registry").textContent = state.registry;
  $("demo").hidden = !state.demo;
  renderLevels();
  const shown = (format) => level === "all" || format === level;
  // Grouped by format, video first, and in label order within each, as the registry lists them.
  const rank = (format) => { const i = formats().indexOf(format); return i < 0 ? 99 : i; };
  const byFormat = (a, b) => rank(a.format) - rank(b.format);
  const columns = state.senders.map((s, i) => ({ ...s, i })).filter((s) => shown(s.format)).sort(byFormat);
  const rows = state.receivers.filter((r) => shown(r.format)).sort(byFormat);
  renderSources(columns);
  if (!rows.length) {
    $("grid").className = "empty";
    $("grid").textContent = state.receivers.length ? "No receivers at this level." : "No receivers are registered.";
    return;
  }
  const head = el("tr", {}, el("th", { class: "corner", text: `${rows.length} receivers × ${columns.length} senders` }));
  columns.forEach((s, c) => {
    const where = s.device && s.device !== s.label ? s.device : "";
    head.append(el("th", { class: "src", "data-col": c, title: `${name(s)}${where ? " (" + where + ")" : ""}\n${s.id}` },
      el("div", { class: "stack" }, el("span", { text: name(s) }), where ? el("small", { text: where }) : null)));
  });
  head.append(el("th", { class: "src" }, el("div", { class: "stack" }, el("span", { text: "Off" }))));
  const body = el("tbody");
  let group = null;
  for (const r of rows) {
    if (level === "all" && r.format !== group) {
      group = r.format;
      body.append(el("tr", {}, el("th", { class: "group label", colspan: String(columns.length + 2), text: group || "other" })));
    }
    const fits = new Set(r.fits);
    const where = r.device && r.device !== r.label ? r.device : "";
    // The grid is drawn afresh on every read, so each receiver keeps its thumbnail's
    // element: a new one would show nothing until its picture had loaded again.
    let thumb = null;
    if (live && r.format === "video" && r.active && r.sender_id) {
      thumb = thumbs.get(r.id);
      if (!thumb) { thumb = el("img", { class: "thumb", alt: "" }); thumbs.set(r.id, thumb); }
      thumb.setAttribute("data-thumb", r.sender_id);
    } else thumbs.delete(r.id);
    const tr = el("tr", {}, el("th", { class: "dst", title: r.id }, thumb, name(r), where ? el("small", { text: where }) : null));
    columns.forEach((s, c) => {
      // The hover says what a click does in this mode, and the state it is in.
      const isArmed = armed.has(r.id) && armed.get(r.id) === s.id;
      let kind = "fit", label = salvo
        ? (isArmed ? `${name(r)} from ${name(s)}, armed for the salvo: click to release` : `Arm ${name(r)} from ${name(s)} for the salvo`)
        : `${$("dry").checked ? "Check" : "Connect"} ${name(r)} to ${name(s)}: click to ${$("dry").checked ? "check" : "take"} now`;
      if (r.current === s.i) { kind = "live"; label = `${name(r)} is taking ${name(s)}`; }
      else if (s.format && r.format && s.format !== r.format) { kind = "na"; label = ""; }
      else if (!fits.has(s.i)) { kind = "unfit"; label = `${name(r)} cannot take ${name(s)}: click for why`; }
      const button = el("button", {
        class: kind, "aria-label": label, title: label,
        onclick: () => click(r, s, kind),
      });
      if (salvo && kind === "fit") button.setAttribute("aria-pressed", String(isArmed));
      if (isArmed) button.dataset.armed = "true";
      if (busy.has(r.id) && (armed.get(r.id) === s.id || pendingTake.get(r.id) === s.id)) button.setAttribute("aria-busy", "true");
      if (kind === "na") button.tabIndex = -1;
      tr.append(el("td", { class: "cell", "data-col": c }, button));
    });
    const takes = r.active && r.sender_id;
    const offArmed = armed.has(r.id) && armed.get(r.id) === null;
    const offTitle = !takes && !offArmed ? `${name(r)} is not taking a stream`
      : salvo ? (offArmed ? `Disconnecting ${name(r)} is armed for the salvo: click to release` : `Arm disconnecting ${name(r)} for the salvo`)
      : `${$("dry").checked ? "Check disconnecting" : "Disconnect"} ${name(r)}: click to ${$("dry").checked ? "check" : "take"} now`;
    const off = el("button", {
      class: "off", text: "off", title: offTitle, "aria-label": `Disconnect ${name(r)}`,
      onclick: () => click(r, null, takes ? "fit" : "idle"),
    });
    if (salvo && (takes || offArmed)) off.setAttribute("aria-pressed", String(offArmed));
    if (offArmed) off.dataset.armed = "true";
    if (busy.has(r.id) && pendingTake.get(r.id) === null) off.setAttribute("aria-busy", "true");
    if (!takes && !offArmed) off.disabled = true;
    tr.append(el("td", { class: "cell" }, off));
    if (r.active && r.sender_id && r.current == null) {
      tr.firstChild.append(el("small", { text: `taking unregistered sender ${r.sender_id.slice(0, 8)}` }));
    }
    body.append(tr);
  }
  const table = el("table", {}, el("thead", {}, head), body);
  table.addEventListener("mouseover", (e) => crosshair(e.target.closest("td.cell, th.src"), table));
  table.addEventListener("mouseleave", () => crosshair(null, table));
  $("grid").className = "";
  $("grid").replaceChildren(table);
  renderSalvo();
  showLive();
}

function crosshair(cell, table) {
  for (const node of table.querySelectorAll(".hover")) node.classList.remove("hover");
  if (!cell) return;
  const col = cell.getAttribute("data-col");
  if (cell.tagName === "TD") cell.parentElement.classList.add("hover");
  if (col != null) for (const node of table.querySelectorAll(`[data-col="${col}"]`)) node.classList.add("hover");
}

const pendingTake = new Map();

async function click(receiver, sender, kind) {
  if (kind === "na" || kind === "idle" && !salvo) return;
  if (kind === "unfit") return explain(receiver, sender);
  $("info").hidden = true;
  if (kind === "live" && !salvo) return;
  const senderId = sender ? sender.id : null;
  if (salvo) {
    if (armed.has(receiver.id) && armed.get(receiver.id) === senderId) armed.delete(receiver.id);
    else if (kind === "live") armed.delete(receiver.id);
    else armed.set(receiver.id, senderId);
    render();
    return;
  }
  await take([{ receiver: receiver.id, sender: senderId }]);
}

async function explain(receiver, sender) {
  const info = $("info");
  info.hidden = false;
  info.textContent = `Checking why ${name(receiver)} cannot take ${name(sender)}…`;
  try {
    const why = await call(`/api/why?sender=${encodeURIComponent(sender.id)}&receiver=${encodeURIComponent(receiver.id)}`);
    info.textContent = why.fits ? `${name(receiver)} can take ${name(sender)} now.` : `${name(receiver)} cannot take ${name(sender)}: ${why.reason}`;
  } catch (e) {
    info.textContent = e.message;
  }
}

async function take(routes) {
  if (taking) return;
  taking = true;
  for (const route of routes) { busy.add(route.receiver); pendingTake.set(route.receiver, route.sender); }
  render();
  try {
    const outcome = await call("/api/take", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ routes, dry_run: $("dry").checked }),
    });
    log(outcome);
    if (outcome.succeeded && !$("dry").checked) for (const route of routes) armed.delete(route.receiver);
  } catch (e) {
    // Nothing is switched when the router answers with a refusal; when it cannot
    // be reached, the grid says what is switched once it answers again.
    logError(e.unreachable ? `${e.message} What is switched shows in the grid once it answers.` : `Nothing was switched: ${e.message}`);
  } finally {
    for (const route of routes) { busy.delete(route.receiver); pendingTake.delete(route.receiver); }
    taking = false;
    await read();
    render();
  }
}

// A mode shows itself twice: the segment that is pressed, and these words
// saying what a click does in it. Check only changes what Take says too.
function renderSalvo() {
  const dry = $("dry").checked;
  $("mode-take").setAttribute("aria-pressed", String(!salvo));
  $("mode-salvo").setAttribute("aria-pressed", String(salvo));
  $("fire").hidden = !salvo;
  $("clear").hidden = !salvo;
  // Taking is busy, not disabled: no second press, and a spinner once it has run timing.wait.
  $("fire").disabled = !armed.size && !taking;
  if (taking) $("fire").setAttribute("aria-busy", "true"); else $("fire").removeAttribute("aria-busy");
  $("clear").disabled = !armed.size;
  const lead = state ? state.lead : 2;
  const verb = dry ? "Check" : "Take";
  $("fire").textContent = armed.size > 1 ? `${verb} ${armed.size} together` : `${verb} ${armed.size || ""}`.trim();
  $("fire").title = dry ? "Check each armed crosspoint against its Receiver, and connect nothing"
    : armed.size > 1 ? `They switch together at one PTP time, ${lead} s after they are sent` : "";
  $("mode-hint").textContent = salvo
    ? (dry ? "Arm, then Check: nothing connects" : "Click crosspoints to arm, then Take")
    : (dry ? "Each click checks: nothing connects" : "Each click connects at once");
}

function stamp() {
  return el("time", { text: new Date().toLocaleTimeString() });
}

function clearEmpty() {
  const empty = $("log").querySelector(".empty");
  if (empty) empty.remove();
}

function log(outcome) {
  clearEmpty();
  const dry = $("dry").checked;
  for (const c of [...outcome.connections].reverse()) {
    const good = ["done", "scheduled", "planned"].includes(c.state);
    const soft = ["held", "rolled-back"].includes(c.state);
    const entry = el("div", { class: "entry " + (good ? "ok" : soft ? "warn" : "bad") }, stamp(), (dry ? "Check only: " : "") + c.describe);
    const details = [...c.problems.map((t) => "problem: " + t), ...c.warnings.map((t) => "warning: " + t), ...c.notes.map((t) => "note: " + t)];
    if (details.length) entry.append(el("ul", {}, ...details.map((t) => el("li", { text: t }))));
    $("log").prepend(entry);
  }
}

function logError(message) {
  clearEmpty();
  $("log").prepend(el("div", { class: "entry bad" }, stamp(), message));
}

// Live previews: the router receives the streams of the sources on show and the page
// shows what arrived. They start on with the demo; on a real network each stream takes
// its full bandwidth on this machine's link, so they wait to be turned on.
let live = null;          // whether previews are on; null until the registry is first read
let liveStatus = {};      // sender id -> what has arrived of its stream
let refused = {};         // sender id -> why its stream is not being received
let watched = [];         // sender ids asked for
let opened = null;        // the sender whose details are open
const cards = new Map();  // sender id -> its card
const thumbs = new Map(); // receiver id -> its thumbnail in the grid

function remembered() {
  try { const v = localStorage.getItem("st2110-router-live"); return v === null ? null : v === "1"; } catch (_) { return null; }
}

function setLive(on) {
  live = Boolean(on) && !!state && state.previews > 0;
  $("live").checked = live;
  $("live").disabled = !!state && state.previews === 0;
  if (!live) { liveStatus = {}; refused = {}; watched = []; }
  render();
  if (live) watch();
}

function routedTo(sender) {
  return state.receivers.filter((r) => r.active && r.sender_id === sender.id).map(name);
}

function renderSources(columns) {
  const box = $("cards");
  const wanted = columns.map((s) => s.id);
  for (const id of [...cards.keys()]) if (!wanted.includes(id)) cards.delete(id);
  box.replaceChildren(...columns.map((s) => {
    let node = cards.get(s.id);
    if (!node) {
      node = el("button", { class: "card", "data-sender": s.id, "aria-expanded": "false", "aria-controls": "details", onclick: () => openDetails(s.id) },
        el("div", { class: "screen", "data-theme": "dark" }),
        el("div", { class: "meta" },
          el("div", { class: "title" }, el("span", { class: "ds-dot ds-dot--off" }), el("span", { class: "name" })),
          el("div", { class: "line where" }), el("div", { class: "line format" }), el("div", { class: "line stats" })));
      cards.set(s.id, node);
    }
    node.sender = s;
    return node;
  }));
  if (!columns.length) box.replaceChildren(el("div", { class: "empty", text: "No senders at this level." }));
}

function fmt(n, digits = 1) { return Number.isFinite(n) ? n.toFixed(digits) : "–"; }

function db(level) { return level == null ? "−∞" : fmt(level, 0); }

function statsLine(report) {
  if (!report) return "";
  const parts = [`${fmt(report.megabits_per_second)} Mb/s`];
  if (report.video) parts.push(`${fmt(report.video.frame_rate)} fps`);
  parts.push(`${report.lost} lost`);
  if (report.class) parts.push(`2022-7 class ${report.class}`);
  return parts.join(" · ");
}

function screenFor(screen, s, st) {
  const note = (text) => screen.replaceChildren(el("span", { class: "note", text }));
  if (!live) return note(state && state.previews === 0 ? "Previews are off (--previews 0)" : "Previews off");
  if (refused[s.id]) return note(refused[s.id]);
  if (!watched.includes(s.id)) return note(`Not previewed: at most ${state.previews} at once`);
  if (st && st.error) return note(st.error);
  if (s.format === "video") {
    if (!st || !st.pictures) return note("Waiting for the stream…");
    const src = `/api/preview?sender=${encodeURIComponent(s.id)}&n=${st.pictures}`;
    let img = screen.querySelector("img");
    if (!img) { img = el("img", { alt: `${name(s)}, live` }); screen.replaceChildren(img); }
    if (img.getAttribute("src") !== src) img.src = src;
    return;
  }
  if (s.format === "audio") {
    if (!st || !st.report) return note("Waiting for the stream…");
    let meters = screen.querySelector(".meters");
    if (!meters || meters.childElementCount !== st.levels.length) {
      meters = el("div", { class: "meters", role: "img" }, ...st.levels.map(() => el("div", { class: "meter" }, el("i"), el("span"))));
      screen.replaceChildren(meters);
    }
    meters.setAttribute("aria-label", `Levels ${st.levels.map(db).join(", ")} dBFS`);
    st.levels.forEach((level, i) => {
      const meter = meters.children[i];
      // −60 dBFS at the bottom, full scale at the top; the cover hides what is above the level.
      const height = level == null ? 0 : Math.max(0, Math.min(1, (level + 60) / 60));
      meter.firstChild.style.height = `${((1 - height) * 100).toFixed(1)}%`;
      meter.lastChild.textContent = db(level);
    });
    return;
  }
  note("No preview for this format");
}

function showLive() {
  if (!state) return;
  for (const node of cards.values()) {
    const s = node.sender;
    const st = liveStatus[s.id];
    const to = routedTo(s);
    node.setAttribute("aria-expanded", String(opened === s.id));
    node.querySelector(".name").textContent = name(s);
    node.title = opened === s.id ? `${name(s)}: click to close its details` : `${name(s)}: click for details`;
    node.querySelector(".where").textContent = to.length ? `to ${to.join(", ")}` : `${s.device || ""}${s.device ? " · " : ""}not routed`;
    node.querySelector(".format").textContent = (st && st.report && st.report.stream) || s.summary || s.format || "";
    node.querySelector(".stats").textContent = live && st ? statsLine(st.report) : "";
    // Hollow while nothing is being received, so off is told by its shape too.
    const dot = node.querySelector(".ds-dot");
    const problems = st && st.report ? st.report.problems.length : 0;
    dot.className = "ds-dot " + (!live || !st ? "ds-dot--off" : st.error ? "ds-dot--bad" : problems ? "ds-dot--warn" : st.report ? "ds-dot--ok" : "ds-dot--off");
    screenFor(node.querySelector(".screen"), s, st);
    node.classList.toggle("routed", to.length > 0);
    const title = node.querySelector(".title");
    const tally = title.querySelector(".tally");
    if (to.length && !tally) title.append(el("span", { class: "tally", text: "ROUTED" }));
    else if (!to.length && tally) tally.remove();
  }
  for (const img of document.querySelectorAll("img[data-thumb]")) {
    const id = img.getAttribute("data-thumb");
    const st = liveStatus[id];
    if (st && st.pictures) {
      const src = `/api/preview?sender=${encodeURIComponent(id)}&n=${st.pictures}`;
      if (img.getAttribute("src") !== src) img.src = src;
    }
  }
  const shown = cards.size;
  $("sources-note").textContent = !live ? "" : shown > state.previews
    ? `previewing ${Math.min(shown, state.previews)} of ${shown}, at most ${state.previews} at once`
    : `previewing ${shown}, received on this machine`;
  if (opened) showDetailsLive();
}

async function watch() {
  if (!live || document.hidden || !state) return;
  watched = [...cards.keys()].slice(0, state.previews);
  try {
    const answer = await call("/api/watch", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ senders: watched }),
    });
    refused = answer.refused || {};
    liveStatus = answer.senders || {};
    showLive();
  } catch (e) {
    for (const id of watched) refused[id] = e.message;
    showLive();
  }
}

async function poll() {
  if (!live || document.hidden) return;
  try {
    const answer = await call("/api/live");
    if (live) { liveStatus = answer.senders || {}; showLive(); }
  } catch (_) { /* the next read reports the router unreachable */ }
}

let details = null;  // what /api/stream answered for the open sender

async function openDetails(id) {
  if (opened === id) { opened = null; details = null; $("details").hidden = true; showLive(); return; }
  opened = id;
  details = null;
  showLive();
  const box = $("details");
  box.hidden = false;
  box.replaceChildren(el("div", { class: "empty", text: "Reading the stream's details…" }));
  try {
    details = await call(`/api/stream?sender=${encodeURIComponent(id)}`);
    if (opened === id) renderDetails();
  } catch (e) {
    if (opened === id) box.replaceChildren(el("div", { text: e.message }));
  }
}

function facts(pairs) {
  const dl = el("dl", { class: "facts" });
  for (const [key, value] of pairs) if (value != null && value !== "") dl.append(el("dt", { text: key }), el("dd", { text: String(value) }));
  return dl;
}

function rational(r) { return r && r.numerator ? (r.denominator && r.denominator !== 1 ? `${r.numerator}/${r.denominator}` : String(r.numerator)) : null; }

function renderDetails() {
  const d = details, f = d.flow || {}, src = d.source || {}, snd = d.sender || {};
  const box = $("details");
  const close = el("button", { class: "ds-btn", text: "Close", onclick: () => openDetails(d.id) });
  const flowFacts = [
    ["Device", d.device], ["Node", d.node], ["Format", f.media_type || f.format],
    ["Picture", f.frame_width ? `${f.frame_width} × ${f.frame_height}${f.interlace_mode && f.interlace_mode !== "progressive" ? " " + f.interlace_mode : ""}` : null],
    ["Rate", rational(f.grain_rate) && `${rational(f.grain_rate)} per second`],
    ["Colour", f.colorspace && `${f.colorspace}${f.transfer_characteristic ? ", " + f.transfer_characteristic : ""}`],
    ["Sampling", f.sample_rate ? `${rational(f.sample_rate)} Hz, ${f.bit_depth || "?"}-bit` : null],
    ["Channels", src.channels ? src.channels.map((c) => c.symbol || c.label).join(" ") : null],
    ["Transport", snd.transport], ["Interfaces", (snd.interface_bindings || []).join(", ")],
    ["Taking it", d.receivers.length ? d.receivers.join(", ") : "nothing"],
    ["Sender", d.id], ["Flow", f.id], ["Source", src.id], ["SDP file", d.sdp_url],
  ];
  const legs = el("div");
  for (const stream of d.streams || []) {
    const chips = el("div", { class: "chips" }, ...(stream.parameters || []).map((p) => el("span", { text: p.value == null ? p.name : `${p.name}=${p.value}` })));
    const clock = stream.reference_clock;
    legs.append(facts([
      [stream.mid ? `Leg ${stream.mid}` : `Stream ${stream.index + 1}`, stream.summary],
      ["To", stream.destination && `${stream.destination}:${stream.port}${stream.source ? " from " + stream.source : ""}`],
      ["RTP", `payload type ${stream.payload_type}, ${stream.encoding}/${stream.clock_rate}`],
      ["Clock", clock && (clock.type === "ptp" ? `PTP ${clock.grandmaster || "traceable"}${clock.domain != null ? " domain " + clock.domain : ""}` : clock.type)],
    ]), chips);
  }
  const findings = d.findings.length
    ? el("ul", {}, ...d.findings.map((x) => el("li", { class: x.severity === "error" ? "problem" : x.severity === "warning" ? "warning" : "", text: `${x.severity}: ${x.message}${x.line ? " (line " + x.line + ")" : ""}` })))
    : el("div", { class: "line", text: "None: the SDP file passes every check." });
  box.replaceChildren(
    el("div", { class: "details-head" }, el("h2", { text: snd.label || d.id }), el("span", { class: "spacer" }), close),
    facts(flowFacts),
    el("h3", { class: "label", text: "Received here" }), el("div", { id: "details-live" }),
    el("h3", { class: "label", text: "SDP file" }),
    d.sdp_error ? el("div", { class: "line", text: `Cannot be read: ${d.sdp_error}` }) : legs,
    el("h3", { class: "label", text: "Checks on the SDP file" }), findings,
    ...(d.sdp ? [el("details", { class: "ds-disclosure" }, el("summary", { text: "The SDP file" }), el("div", { class: "ds-disclosure__body" }, el("pre", { class: "sdp", text: d.sdp })))] : []),
  );
  showDetailsLive();
}

function showDetailsLive() {
  const box = $("details-live");
  if (!box || !details) return;
  const st = liveStatus[details.id];
  const r = st && st.report;
  if (!live || !r) {
    box.replaceChildren(el("div", { class: "line", text: !live ? "Turn on live previews to receive this stream here." : (st && st.error) || refused[details.id] || "Waiting for the stream…" }));
    return;
  }
  const pairs = [
    ["Stream", r.stream], ["Bit rate", `${fmt(r.megabits_per_second)} Mb/s`],
    ["Packets", `${r.passed} passed, ${r.lost} lost, ${r.too_late} too late`],
    ["Frames", r.video && `${fmt(r.video.frame_rate, 2)} per second, ${r.video.packets_per_frame} packets each`],
    ["Levels", st.levels.length ? st.levels.map((l) => `${db(l)} dBFS`).join(", ") : null],
    ["Latency", r.latency && `${fmt(r.latency.mean / 1000)} ms mean, ${fmt(r.latency.max / 1000)} ms most`],
    ["ST 2022-7", r.skew ? `legs ${fmt(r.skew.max_ns / 1e6, 2)} ms apart at most, class ${r.class || "beyond C"}` : null],
    ["Restarts", r.restarts || null],
  ];
  r.legs.forEach((leg, i) => pairs.push([`Leg ${i + 1}`, `${leg.leg}: ${leg.datagrams} datagrams`]));
  const notes = [...r.problems.map((t) => el("li", { class: "problem", text: t })), ...r.notes.map((t) => el("li", { text: t }))];
  box.replaceChildren(facts(pairs), ...(notes.length ? [el("ul", {}, ...notes)] : []));
}

$("live").onchange = () => {
  try { localStorage.setItem("st2110-router-live", $("live").checked ? "1" : "0"); } catch (_) { /* not kept */ }
  setLive($("live").checked);
};
setInterval(watch, 3000);
setInterval(poll, 500);

$("dry").onchange = () => { renderSalvo(); render(); };
$("mode-take").onclick = () => { salvo = false; armed.clear(); render(); renderSalvo(); };
$("mode-salvo").onclick = () => { salvo = true; render(); renderSalvo(); };
$("clear").onclick = () => { armed.clear(); render(); renderSalvo(); };
$("fire").onclick = () => take([...armed].map(([receiver, sender]) => ({ receiver, sender })));
$("refresh").onclick = () => read();
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && salvo) { armed.clear(); render(); renderSalvo(); }
});
renderSalvo();
read();
setInterval(() => { if (!document.hidden) read(); }, 3000);
</script>
</body>
</html>
