[package]
name = "st2110-cli"
description = "Command-line checks for SMPTE ST 2110 SDP files, NMOS registries, PTP messages and packet captures, IS-05 connections, and a software sender and receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "st2110"
path = "src/main.rs"

[dependencies]
st2110-sdp = { workspace = true, features = ["serde"] }
st2110-nmos = { workspace = true, features = ["client"] }
st2110-ptp = { workspace = true, features = ["serde"] }
st2110-pcap = { workspace = true, features = ["serde"] }
st2110-connect = { workspace = true, features = ["client"] }
st2110-media = { workspace = true, features = ["net", "serde"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
