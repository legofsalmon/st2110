[package]
name = "st2110-wasm"
description = "WebAssembly bindings for the ST 2110 SDP linter, NMOS registry checks, IS-05 connection planner, PTP tools and capture analyser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
st2110-sdp = { workspace = true, features = ["serde"] }
st2110-nmos.workspace = true
st2110-connect.workspace = true
st2110-ptp = { workspace = true, features = ["serde"] }
st2110-pcap = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
